<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ARMM Live · AR4Z Manpower Monitoring</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARMM">
<style>
  :root{
    --bg:#eef5fb; --card:#fff; --ink:#0b2f4e; --ink2:#4a5d70; --ink3:#93a4b5; --line:#dbe6f0;
    --brand:#0f75bc; --brand-dk:#0b5c94; --accent:#00aeef; --accent-ink:#ffffff;   /* AR4Z logo colours */
    --in:#15803d; --in-bg:#dcfce7; --out:#b91c1c; --out-bg:#fee2e2;
    --otin:#b45309; --otin-bg:#fef3c7; --otout:#334155; --otout-bg:#e2e8f0;
    --warn:#92400e; --warn-bg:#fef3c7; --err:#991b1b; --err-bg:#fee2e2; --ok:#166534; --ok-bg:#dcfce7;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  [hidden]{display:none!important}
  .muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink3)}
  .tnum{font-variant-numeric:tabular-nums}

  /* demo bar */
  #demoBar{position:sticky;top:0;z-index:50;background:#0b2f4e;color:#e5e7eb;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
  #demoBar b{color:var(--accent)}
  #demoBar button{background:#374151;border:0;color:#fff;padding:5px 10px;border-radius:999px}
  #demoBar button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
  #demoBar .hint{margin-left:auto;color:#9ca3af}

  /* ---------- worker phone ---------- */
  .phone{max-width:460px;margin:0 auto;padding:0 0 32px}
  .w-head{background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;padding:14px 16px 54px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .hr{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:10px;background:#fff;padding:3px;display:block;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .brand{display:flex;gap:8px;align-items:center;font-weight:700;letter-spacing:.2px}
  .brand i{display:none}
  .appname{line-height:1.1;min-width:0}
  .an-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .an-top b{font-size:24px;font-weight:800;letter-spacing:1.5px}
  .an-top span{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;opacity:.75}
  .an-sub{font-size:14px;font-weight:600;opacity:.92;margin-top:3px}
  .login-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;color:var(--brand)}
  .login-head .an-sub{color:var(--ink)}
  @media (max-width:420px){.an-top span{display:none}}
  .clock{text-align:right;line-height:1.15}
  .clock b{font-size:20px;display:block}
  .clock span{font-size:12px;color:#cfe9fb}
  .sheet{margin:-40px 12px 0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px}
  .who{display:flex;gap:12px;align-items:center}
  .avatar{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
  .who h1{font-size:19px;margin:0;line-height:1.2}
  .who p{margin:2px 0 0;color:var(--ink2);font-size:14px}
  .status{margin-top:14px;padding:10px 12px;border-radius:10px;font-weight:600;display:flex;gap:8px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ink3)}
  .st-absent{background:#f3f4f6;color:var(--ink2)}
  .st-onsite{background:var(--in-bg);color:var(--in)} .st-onsite .dot{background:var(--in)}
  .st-ot{background:var(--otin-bg);color:var(--otin)} .st-ot .dot{background:var(--otin)}
  .st-done{background:var(--otout-bg);color:var(--otout)} .st-done .dot{background:var(--otout)}
  .field{display:block;margin-top:14px}
  .field>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
  .field select,.field input{width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
  .field select:focus,.field input:focus{outline:none;border-color:var(--ink)}
  .pin{letter-spacing:6px;font-weight:700;text-align:center}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .scan{border:0;border-radius:14px;padding:18px 10px 14px;text-align:center;font-weight:800;font-size:20px;letter-spacing:.5px;position:relative;transition:transform .08s}
  .scan:active{transform:scale(.97)}
  .scan small{display:block;font-weight:500;font-size:12px;letter-spacing:0;opacity:.85;margin-top:2px}
  .scan:disabled{opacity:.5}
  .t-in{background:var(--in-bg);color:var(--in)} .t-out{background:var(--out-bg);color:var(--out)}
  .t-otin{background:var(--otin-bg);color:var(--otin)} .t-otout{background:var(--otout-bg);color:var(--otout)}
  .scan.sugg{box-shadow:0 0 0 3px var(--brand) inset}
  .scan.sugg.t-in{background:var(--in);color:#fff} .scan.sugg.t-out{background:var(--out);color:#fff}
  .scan.sugg.t-otin{background:var(--otin);color:#fff} .scan.sugg.t-otout{background:var(--otout);color:#fff}
  .scan.sugg:before{content:"NEXT";position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:10px;padding:2px 8px;border-radius:999px;letter-spacing:1px}
  .msg{margin-top:14px;padding:11px 12px;border-radius:10px;font-weight:600;font-size:14px}
  .msg.err{background:var(--err-bg);color:var(--err)} .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .log{margin:16px 12px 0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
  .log h2{font-size:14px;margin:0 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px}
  .log-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .log-row:first-of-type{border-top:0}
  .tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;min-width:62px;text-align:center}
  .log-row .t{font-weight:700;margin-left:auto}
  .linkbtn{background:none;border:0;color:var(--ink2);text-decoration:underline;padding:0;font-size:13px}
  .center{text-align:center}

  /* overlay */
  .overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(17,24,39,.55)}
  .ov-card{background:#fff;border-radius:20px;max-width:360px;width:100%;padding:28px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .ov-ic{width:76px;height:76px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;color:#fff;font-size:40px;font-weight:800}
  .ov-card h3{margin:0;font-size:24px}
  .ov-card .big{font-size:34px;font-weight:800;margin:6px 0 2px}
  .ov-actions{display:flex;gap:10px;margin-top:18px}
  .ov-actions button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700}
  .ov-actions .primary{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* picker */
  .search{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
  .plist{margin-top:10px;max-height:60vh;overflow:auto}
  .pitem{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 4px;text-align:left}
  .pitem .avatar{width:38px;height:38px;font-size:14px;border-radius:10px}

  /* ---------- admin ---------- */
  .admin{max-width:1240px;margin:0 auto;padding:0 16px 40px}
  .a-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 10px}
  .a-band{background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;margin-bottom:14px;box-shadow:0 2px 10px rgba(15,117,188,.25)}
  .a-band .a-top{max-width:1240px;margin:0 auto;padding:12px 16px}
  .a-top .brand{font-size:18px}
  .a-band .tabs{background:rgba(255,255,255,.14);order:3;margin-left:0;flex:0 1 auto;max-width:100%;overflow:auto}
  .a-band .a-top{flex-wrap:wrap;row-gap:10px}
  .a-band .uchip{margin-left:auto}
  .a-band .tabs button{color:#dff2fd}
  .a-band .tabs button.on{background:#fff;color:var(--brand)}
  .tabs{display:flex;gap:4px;background:#e5e7eb;padding:4px;border-radius:12px;margin-left:auto}
  .tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--ink2)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
  .bar input[type=date],.bar select,.bar .search{padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:14px;width:auto}
  .bar .search{min-width:200px}
  .btn{border:1.5px solid var(--line);background:#fff;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px}
  .btn:hover{border-color:#cbd5e1}
  .btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.dark:hover{background:var(--brand-dk)}
  .btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .updated{margin-left:auto;font-size:12px;color:var(--ink3)}
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;border:0;text-align:left}
  .kpi.on{outline:2px solid var(--accent)}
  .kpi .n{font-size:30px;font-weight:800;line-height:1.1}
  .kpi .l{font-size:13px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:14px}
  .feed{max-height:460px;overflow:auto}
  @media (min-width:1500px){.grid2{grid-template-columns:minmax(0,1fr) 300px}.feed{max-height:none}}
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
  .panel h2{font-size:13px;margin:0 0 10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
  .sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
  .site{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;border-top:4px solid var(--accent)}
  .site h3{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  .site h3 span{background:var(--brand);color:#fff;border-radius:999px;padding:0 9px;font-size:12px;line-height:20px}
  .site ul{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
  .site li{display:flex;align-items:center;gap:7px;padding:3px 0}
  .site li .tnum{margin-left:auto;color:var(--ink2)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:12px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff}
  td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fafafa}
  .tbl-wrap{overflow:auto;max-height:70vh}
  .flag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--warn-bg);color:var(--warn);margin-right:4px}
  .flag.red{background:var(--err-bg);color:var(--err)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
  .feed .row{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
  .feed .row:first-child{border-top:0}
  .feed .row .tag{min-width:54px;font-size:11px}
  .feed .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .feed .tm{margin-left:auto;color:var(--ink2)}
  .wk td.d{text-align:center;min-width:64px}
  .wk .h{font-weight:700}
  .wk .ot{display:block;font-size:11px;color:var(--otin);font-weight:700}
  .wk .s{display:block;font-size:10.5px;color:var(--ink3);max-width:90px;overflow:hidden;text-overflow:ellipsis}
  .wk tfoot td{font-weight:800;border-top:1.5px solid var(--line)}
  .note{font-size:12.5px;color:var(--ink2);margin-top:10px}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .badge{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px;text-align:center;border-top:6px solid var(--brand);break-inside:avoid}
  .badge .qr{width:172px;height:172px;margin:6px auto;display:grid;place-items:center}
  .badge .qr svg,.badge .qr img{width:172px;height:172px}
  .badge b{display:block;font-size:15px;line-height:1.2}
  .badge span{font-size:12px;color:var(--ink2)}
  .badge{position:relative;overflow:hidden}
  .badge>*{position:relative;z-index:1}
  .badge>.bgl{position:absolute;z-index:0;left:50%;top:50%;width:88%;height:auto;transform:translate(-50%,-46%);opacity:.2;pointer-events:none}
  .badge .co b{color:var(--brand);letter-spacing:1px;display:inline;font-size:11px}
  .badge .blogo{width:26px;height:26px;display:inline-block;vertical-align:middle;margin-right:6px;padding:0;box-shadow:none}
  .badge .co{font-size:10px;letter-spacing:1px;color:var(--ink3);text-transform:uppercase;margin-top:6px}
  .set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .bigpin{font-size:44px;font-weight:800;letter-spacing:10px;margin:4px 0 10px}
  .linkrow{display:flex;gap:8px;align-items:center;margin:8px 0}
  .linkrow code{flex:1;background:#f3f4f6;border-radius:8px;padding:8px 10px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pay td.d{min-width:92px;cursor:pointer}
  .pay td.d:hover{background:#fffbeb}
  .pay .pp{display:block;font-size:12px;color:var(--ink2)}
  .pay td.adj{cursor:pointer}
  .pay-title{font-size:20px;margin:0 0 12px}
  .sitecost div{display:grid;grid-template-columns:200px 1fr;gap:4px 12px;align-items:center;padding:5px 0;position:relative}
  .sitecost span{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sitecost b{font-size:13px;grid-column:2;grid-row:1;justify-self:end;z-index:1}
  .sitecost i{grid-column:2;grid-row:1;height:22px;background:var(--otin-bg);border-radius:6px;display:block}
  .print-only{display:none}
  .sq-wrap{display:flex;gap:14px;align-items:center}
  .sq{width:130px;height:130px;flex:none;background:#fff;border-radius:10px;padding:4px}
  .sq svg{width:122px;height:122px}
  .poster{position:fixed;inset:0;z-index:95;background:#fff;overflow:auto;display:flex;justify-content:center;padding:30px}
  .pst-in{max-width:560px;width:100%;text-align:center}
  .pst-head{display:flex;gap:14px;align-items:center;justify-content:center;color:var(--brand)}
  .pst-head .logo{width:64px;height:64px}
  .pst-t{font-size:40px;font-weight:800;letter-spacing:3px;line-height:1}
  .pst-s{font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
  .poster h1{font-size:28px;margin:26px 0 10px}
  .pst-qr{width:300px;height:300px;margin:0 auto}
  .pst-qr svg{width:300px;height:300px}
  .poster ol{text-align:left;font-size:18px;line-height:1.6;max-width:440px;margin:16px auto}
  .pst-l{font-size:12px;color:var(--ink2);word-break:break-all}
  .scanbox{position:relative;background:#0b2f4e;border-radius:14px;overflow:hidden;aspect-ratio:1/1;max-height:62vh;margin:0 auto}
  .scanbox video{width:100%;height:100%;object-fit:cover;display:block}
  .scanbox .frame{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(11,47,78,.35)}
  .scanbox .scanmsg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .scanbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .scanbtns .btn{cursor:pointer}
  .scanbig{display:block;width:100%;text-align:center;font-size:18px;padding:16px;border-radius:14px;cursor:pointer}
  .scanbox.idle video,.scanbox.idle .frame{display:none}
  .scanbox .scanidle{display:none}
  .scanbox.idle .scanidle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:absolute;inset:0;color:#dff2fd;text-align:center;padding:24px;font-size:14px;line-height:1.4}
  .scanidle .qrico{font-size:56px;line-height:1;color:#fff}
  .scanidle .qrico svg{width:60px;height:60px;stroke-width:1.4}
  .scanidle .shotprev{max-width:70%;max-height:55%;border-radius:10px;opacity:.85;object-fit:contain}
  .demo-badges{margin-top:12px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;display:flex;flex-wrap:wrap;gap:6px}
  .demo-badges p{width:100%;margin:0}
  .btn.danger{color:var(--out);border-color:#f3c4c4}
  .btn.danger:hover{background:var(--err-bg)}
  .arch{border-left:4px solid var(--otin)}
  .mgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
  .mgrid .panel h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:1000px){.mgrid{grid-template-columns:1fr}}
  .kpi.alert{box-shadow:0 0 0 2px var(--out) inset,var(--shadow)}
  button.kpi{cursor:pointer;font:inherit;color:inherit}
  button.kpi:hover{background:#f6fbff}
  .pay td.d.needs{box-shadow:inset 0 0 0 2px #f59e0b}
  .appr{border-left:4px solid var(--out)}
  /* frozen name column: stays visible while scrolling sideways */
  .frz .stk{position:sticky;left:0;z-index:2;background:#fff}
  .frz thead .stk{z-index:4}
  .frz .stk2{left:38px}
  .frz .stkn{width:38px;min-width:38px;max-width:38px}
  .frz .split{box-shadow:inset -2px 0 0 var(--brand),6px 0 8px -4px rgba(11,47,78,.18);min-width:170px}
  .frz tfoot .stk{background:#f6f9fc}
  .frz tr:hover td.stk{background:#f4f8fc}
  .print-logo{display:none!important}
  .print-only-block{display:none}
  .uchip{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;white-space:nowrap}
  .uchip span{display:flex;flex-direction:column;line-height:1.15;text-align:right;font-weight:600}
  .uchip small{font-weight:500;opacity:.75;font-size:11px}
  /* icon buttons */
  .ibtns{display:flex;gap:6px}
  .btn svg{vertical-align:-4px;margin-right:2px}
  .scanbig svg{width:24px;height:24px;vertical-align:-5px}
  .ibtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 6px 5px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--brand);font-size:10.5px;font-weight:600;line-height:1.1}
  .ibtn:hover{background:#f2f8fd;border-color:#bcd9ee}
  .ibtn span{white-space:nowrap}
  .acct .ibtns{gap:4px}
  .acct .ibtn{min-width:0;padding:6px 8px 5px}
  .ibtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #signOut.ibtn{color:var(--out)}
  .uchip .ibtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
  .uchip .ibtn:hover{background:rgba(255,255,255,.22)}
  .uchip #signOut.ibtn{color:#ffd9d9}
  .acct{margin:14px 12px 0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .acct-who{display:flex;align-items:center;gap:10px;min-width:0}
  .acct-who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
  .acct-who small{display:block;font-size:11px;color:var(--ink2)}
  .avatar.sm{width:34px;height:34px;font-size:13px;border-radius:10px}
  @media (max-width:380px){.ibtn span{display:none}.ibtn{min-width:40px;padding:8px}}
  @media (max-width:600px){
    .admin{padding:0 10px 30px}
    .frz .split{min-width:112px;max-width:140px;white-space:normal}
    .frz .stk2{left:30px}.frz .stkn{width:30px;min-width:30px;max-width:30px}
    .site-sum{overflow-x:auto}
    .site-sum td.num,.site-sum th.num{width:auto}
    .kpi .l .tiny{display:none}
    table.pay tr > :nth-child(3){display:none}
    .kpi .n{font-size:22px!important}
    .panel{padding:12px}
    .a-band .tabs button{padding:7px 10px;white-space:nowrap}
  }
  .chk{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px;background:#f6f9fc;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
  .chk label,.chk1{display:flex;gap:8px;align-items:center}
  .chk1{margin-top:12px;font-size:14px}
  .site-sum h2{display:flex;align-items:center}
  .site-sum .subrow td{font-size:12.5px;color:var(--ink2);border-bottom:1px dashed var(--line);padding-left:22px}
  .site-sum tfoot td{font-weight:800;border-top:1.5px solid var(--line)}
  .site-sum td.num,.site-sum th.num{width:140px}
  .c-sat{background:#eef4fd} .c-sun{background:#fdeeee} .c-wd{background:#eef8f1}
  th.c-sat{background:#d9e7fb;color:#1e3a8a} th.c-sun{background:#fadada;color:#991b1b} th.c-wd{background:#d8f0df;color:#166534}
  tr:hover td.c-sat{background:#e3edfc} tr:hover td.c-sun{background:#fbe3e3} tr:hover td.c-wd{background:#e2f4e8}
  .pay td.d.c-sat:hover,.pay td.d.c-sun:hover,.pay td.d.c-wd:hover{background:#fff7d6}
  th.dh{text-align:center;line-height:1.15;padding:7px 6px}
  th.dh b{display:block;font-size:13px;letter-spacing:.6px}
  th.dh span{display:block;font-size:11px;font-weight:600;text-transform:none;letter-spacing:0;opacity:.8;margin-top:2px}
  .login{max-width:360px;margin:12vh auto 0;padding:0 16px}
  .loading{padding:60px 20px;text-align:center;color:var(--ink2)}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 10px;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:90}

  @media (max-width:900px){
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid2{grid-template-columns:1fr}
    .tabs{margin-left:0;width:100%;overflow:auto}
  }
  @media print{
    body{background:#fff}
    #demoBar,.a-band,.bar,.noprint,.toast{display:none!important}
    body:has(.poster) #app{display:none}
    .poster{position:static;padding:0}
    .print-only-block{display:flex!important}
    .sign-block{gap:40px;margin-top:40px}
    .sign-block div{flex:1;text-align:center;font-size:11px}
    .sign-block span{display:block;border-bottom:1px solid #000;height:30px;margin-bottom:4px}
    table.pay{font-size:11px}
    table.pay td{height:34px}
    table.pay td.sig{min-width:170px;border-bottom:1px solid #999}
    .site-sum{page-break-inside:avoid}
    .site-sum h2{font-size:13px}
    .site-sum .subrow td{font-size:10px}
    .pay-title .print-logo{display:inline-block!important;width:40px;height:40px;vertical-align:middle;margin-right:8px;box-shadow:none}

    table{font-size:10px} td,th{padding:4px}
    th{position:static}
    .frz .stk{position:static;box-shadow:none!important}
    @page{size:landscape;margin:10mm}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

<script>
  // ▼ ARMM Live: paste your Apps Script web app link here (Deploy → Manage deployments → Web app URL, ends in /exec)
  window.ARMM_REMOTE_URL = 'https://script.google.com/macros/s/AKfycbxN6-OnXfllMXOkRGJ-NxQjlldLCJCDeV_cK1sWunXP8on1leQtA1NwuyGhNxRNEr8Pdg/exec';
</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ===================== bootstrap ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Stand-alone page (e.g. GitHub Pages): window.ARMM_REMOTE_URL = your /exec link. Talks to the sheet over the internet,
// outside Google's frame, so the live camera works on iPhones.
const REMOTE = String(window.ARMM_REMOTE_URL || '').trim();
let BOOT = null;
try { BOOT = JSON.parse(document.getElementById('boot').textContent); } catch (e) {}
const DEMO = !REMOTE && (!BOOT || typeof google === 'undefined' || !google.script);
if (REMOTE) {
  const q = {}; new URLSearchParams(location.search).forEach((v, k) => { q[k] = v; });
  BOOT = { params: q, appUrl: REMOTE, config: { types: ['IN','OUT','OT-IN','OT-OUT'], lateAfter: '08:00', weekStart: 6, saveGps: false } };
}
if (!BOOT) BOOT = { params: {}, appUrl: 'https://script.google.com/macros/s/YOUR-DEPLOYMENT-ID/exec',
  config: { types: ['IN','OUT','OT-IN','OT-OUT'], lateAfter: '08:00', weekStart: 6, saveGps: false } };
if (!BOOT.config.roles) BOOT.config.roles = ['Admin', 'Encoder'];
if (BOOT.config.allowNameSearch == null) BOOT.config.allowNameSearch = true;
if (!BOOT.config.pay) BOOT.config.pay = { ROUND_HOURS_TO: 0.25, FULL_DAY_HOURS: 8, HOURS_PER_DAY: 8, LUNCH_START: '12:00', LUNCH_END: '13:00', POSSIBLE_OT_AFTER: 10.5 };
if (BOOT.config.pay.POSSIBLE_OT_AFTER == null) BOOT.config.pay.POSSIBLE_OT_AFTER = 10.5;
const CFG = BOOT.config;

function api(fn, ...args) {
  if (REMOTE) {
    return fetch(REMOTE, { method: 'POST', body: JSON.stringify({ fn, args }) })   // text/plain: no CORS pre-check needed
      .catch(() => { throw new Error('No connection to ARMM. Check the internet and try again.'); })
      .then(r => r.json())
      .then(j => { if (!j.ok) throw new Error(j.error); return j.result; });
  }
  if (DEMO) return new Promise((res, rej) => setTimeout(() => { try { res(Demo[fn](...args)); } catch (e) { rej(e); } }, 300));
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
const errMsg = e => String(e && e.message ? e.message : e).replace(/^(Exception|Error):\s*/, '');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  sget(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  sset(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
};

/* ===================== sign-in ===================== */
const S = { token: store.get('armm_token') || '', user: null, mode: '' };
function setSession(token, user) { S.token = token || ''; S.user = user || null; store.set('armm_token', S.token); }
/** Calls the server with the saved sign-in. If the sign-in is missing or expired, shows the sign-in screen. */
async function call(fn, ...args) {
  try {
    const r = await api(fn, S.token, ...args);
    if (r && r.user) S.user = r.user;
    return r;
  } catch (e) {
    const m = errMsg(e);
    if (/^SIGNIN:/.test(m)) { setSession('', null); clearInterval(A.timer); showLogin(m.replace(/^SIGNIN:\s*/, '')); return new Promise(() => {}); }
    throw e;
  }
}
function signOut() { setSession('', null); clearInterval(A.timer); showLogin(); }
function showLogin(msg) {
  const admin = S.mode === 'admin';
  $('#app').innerHTML = '<div class="login"><div class="login-head">' + appBrand(admin ? 'Attendance Dashboard' : 'Site Attendance') + logoImg() + '</div>' +
    '<form class="panel" id="lf"><h2 style="margin-bottom:4px">Sign in</h2><p class="small muted" style="margin:0 0 6px">' +
    (admin ? 'Sign in with your Admin or Encoder account.' : 'Sign in once on this phone to record attendance.') + '</p>' +
    '<label class="field"><span>Username</span><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false"></label>' +
    '<label class="field"><span>Password</span><input id="lp" type="password" autocomplete="current-password"></label>' +
    (msg ? '<div class="msg err">' + esc(msg) + '</div>' : '') +
    '<button class="btn dark" id="lb" style="width:100%;margin-top:14px;padding:12px">Sign in</button>' +
    '<p class="tiny center" style="margin:12px 0 0">No account yet, or forgot your password? An Admin can reset it in <b>Users &amp; settings</b>. The sheet owner can also use the <b>ARMM → Add or reset a user</b> menu in the Google Sheet.</p></form></div>';
  $('#lu').focus();
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const b = $('#lb'); b.disabled = true; b.textContent = 'Signing in…';
    try {
      const r = await api('login', $('#lu').value.trim(), $('#lp').value);
      setSession(r.token, r.user);
      route(S.mode);
    } catch (err) { showLogin(errMsg(err)); }
  };
}

const ICONS = {

  '<div class="ibtns">' + iconBtn('toDash', 'dash', 'Dashboard') + iconBtn('myPwTop', 'edit', 'My account') + iconBtn('signOut', 'power', 'Sign out') + '</div></div>' : '';
const userChip = () => S.user ? '<div class="uchip"><span title="' + esc(S.user.name) + '">' + esc(firstName(S.user.name)) + '<small>' + esc(S.user.role) + '</small></span>' +
  '<div class="ibtns">' + iconBtn('toScanner', 'camera', 'Scanner') + iconBtn('myPwTop', 'edit', 'My account') + iconBtn('signOut', 'power', 'Sign out') + '</div></div>' : '';
/** Wires the "Change password" / "Sign out" links wherever they appear. */
function wireAccount() {
  const so = $('#signOut'); if (so) so.onclick = signOut;
  const cp = $('#myPwTop'); if (cp) cp.onclick = changeMyPassword;

function goMode(mode) {

const TYPE = {
  'IN':     { cls: 't-in',    sub: 'Start of work' },

};
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDay = (s, o) => parseYmd(s).toLocaleDateString('en-US', o || { weekday: 'short', day: 'numeric', month: 'short' });
const fmtH = h => h > 0.004 ? String(Math.round(h * 100) / 100) : '–';
const to12 = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + ':' + pad(m) + ' ' + (h < 12 ? 'AM' : 'PM'); };
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const norm = s => String(s || '').trim().replace(/\s+/g, ' ').toUpperCase();
const weekStartOf = d => addDays(d, -((d.getDay() - CFG.weekStart + 7) % 7));
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
function loading(t) { $('#app').innerHTML = '<div class="loading"><div class="spin"></div>' + esc(t || 'Loading…') + '</div>'; }
function copy(text) {
  const done = () => toast('Copied');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); }
}
function modal(html) {
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.innerHTML = '<div class="ov-card">' + html + '</div>';
  document.body.appendChild(ov); return ov;
}
function confirmBox(title, text, okLabel) {
  return new Promise(res => {
    const ov = modal('<h3 style="font-size:20px">' + esc(title) + '</h3><p class="muted">' + esc(text) + '</p>' +
      '<div class="ov-actions"><button data-a="0">Cancel</button><button class="primary" data-a="1">' + esc(okLabel || 'Yes') + '</button></div>');
    ov.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { ov.remove(); res(b.dataset.a === '1'); } });
  });
}

/** Turns one worker's scans for one day into times, hours, status and flags. */
function summarize(recs, isPast) {
  const s = { in: null, out: null, otIn: null, otOut: null, reg: 0, ot: 0, sites: [], flags: [], state: 'absent', last: null };
  let openReg = null, openOt = null;
  for (const r of recs) {
    if (r.site && s.sites.indexOf(r.site) < 0) s.sites.push(r.site);
    s.last = r;
    if (r.type === 'IN') { if (!openReg) { openReg = r; if (!s.in) s.in = r; } }
    else if (r.type === 'OUT') {
      if (openReg) { s.reg += r.ts - openReg.ts; openReg = null; } else if (!s.in) s.flags.push('OUT without IN');
      s.out = r;
    } else if (r.type === 'OT-IN') {
      if (openReg) { s.reg += r.ts - openReg.ts; openReg = null; s.flags.push('No OUT before OT'); }
      if (!openOt) { openOt = r; if (!s.otIn) s.otIn = r; }
    } else if (r.type === 'OT-OUT') {
      if (openOt) { s.ot += r.ts - openOt.ts; openOt = null; } else s.flags.push('OT-OUT without OT-IN');
      s.otOut = r;
    }
  }
  s.reg /= 36e5; s.ot /= 36e5;
  if (isPast) {
    if (openReg) s.flags.push('No OUT');
    if (openOt) s.flags.push('No OT-OUT');
    s.state = recs.length ? 'done' : 'absent';
  } else {
    s.state = openOt ? 'ot' : openReg ? 'onsite' : recs.length ? 'done' : 'absent';
  }
  if (s.in && s.in.time > CFG.lateAfter) s.flags.push('Late');
  s.site = s.last ? s.last.site : '';
  return s;
}
function groupRecords(records) {
  const m = {};
  for (const r of records) { const k = norm(r.name) + '|' + r.day; (m[k] = m[k] || []).push(r); }
  return m;
}
/** Day-column colour: Saturday blue, Sunday red, weekdays green. */
const dayCls = d => { const w = parseYmd(d).getDay(); return w === 6 ? 'c-sat' : w === 0 ? 'c-sun' : 'c-wd'; };
const dayTh = d => '<th class="dh ' + dayCls(d) + '"><b>' + esc(parseYmd(d).toLocaleDateString('en-US', { weekday: 'short' })) + '</b><span>' +
  esc(parseYmd(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })) + '</span></th>';

let W = null;
async function showWorker(name, badge) {
  loading('Loading worker…');
  try {
    const d = await call('getWorkerData', name || '', badge || '');
    if (d.error || !d.worker) {
      $('#app').innerHTML = '<div class="phone"><div class="w-head">' + appBrand('Site Attendance') + '' + logoImg() + '</div>' +
        '<div class="sheet"><div class="msg err">' + esc(d.error || 'Name not found') + '</div>' +
        '<p class="center"><button class="btn dark" id="toScan">Scan again</button></p></div></div>';
      $('#toScan').onclick = () => showScanner();
      return;
    }
    const savedSite = store.get('att_site');
    W = {
      d, name: d.worker.name, records: d.todayRecords || [],
      site: d.sites.indexOf(d.lastSite) >= 0 ? d.lastSite : (d.sites.indexOf(savedSite) >= 0 ? savedSite : (d.sites.length === 1 ? d.sites[0] : '')),
      busy: false, msg: null
    };
    renderWorker();
  } catch (e) {
    $('#app').innerHTML = '<div class="phone"><div class="w-head">' + appBrand('Site Attendance') + logoImg() + '</div><div class="sheet"><div class="msg err">' + esc(errMsg(e)) + '</div>' +
      '<p class="center"><button class="btn dark" id="toScan">Scan again</button></p></div></div>';
    $('#toScan').onclick = () => showScanner();
  }
}
function suggestedType(recs) {
  if (!recs.length) return 'IN';
  return { 'IN': 'OUT', 'OT-IN': 'OT-OUT' }[recs[recs.length - 1].type] || null;
}

  const stText = {

function getGps() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      () => res({}), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}
async function doScan(type, sug, s) {
  W.msg = null;
  if (!W.site) { W.msg = { k: 'err', t: 'Choose the construction site first.' }; return renderWorker(); }
  if (sug && type !== sug) {
    const why = s.state === 'onsite' ? W.name + ' is already timed in.' : s.state === 'ot' ? W.name + ' is on overtime.' : W.name + ' has not timed in yet.';
    const ok = await confirmBox('Record ' + type + '?', why + ' The usual next step is ' + sug + '.', 'Yes, record ' + type);
    if (!ok) return;
  }
  W.busy = true; renderWorker();
  try {
    const gps = CFG.saveGps ? await getGps() : {};
    const r = await call('submitAttendance', Object.assign({ name: W.name, type, site: W.site }, gps));
    if (!r.ok) { W.msg = { k: 'warn', t: r.message }; }
    else {
      W.records.push(r.record);
      store.set('att_site', W.site);
      const colors = { 'IN': 'var(--in)', 'OUT': 'var(--out)', 'OT-IN': 'var(--otin)', 'OT-OUT': 'var(--otout)' };
      const ov = modal('<div class="ov-ic" style="background:' + colors[type] + '">✓</div><h3>' + esc(type) + ' recorded</h3>' +
        '<div class="big tnum">' + esc(r.record.time12) + '</div><div class="muted">' + esc(W.name) + '<br>' + esc(r.record.site) + '</div>' +
        '<div class="ov-actions"><button data-a="stay">Stay</button><button class="primary" data-a="next">Scan next worker</button></div>');
      let done = false;
      const close = next => { if (done) return; done = true; ov.remove(); if (next) showScanner(); };
      ov.onclick = e => { const b = e.target.closest('button'); close(!b || b.dataset.a !== 'stay'); };
      setTimeout(() => close(true), 4000);   // goes back to the scanner by itself
    }
  } catch (e) { W.msg = { k: 'err', t: errMsg(e) }; }
  W.busy = false; renderWorker();
}

/* ===================== QR SCANNER (inside the app) ===================== */
const SC = { stream: null, timer: null, detector: null, busy: false };
function stopScanner() {
  clearInterval(SC.timer); SC.timer = null;
  if (SC.stream) { SC.stream.getTracks().forEach(t => t.stop()); SC.stream = null; }
}
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('QR reader could not load. Check the internet connection.'));
    document.head.appendChild(s);
  });
}
/** Reads a QR from a video frame, canvas or image. Uses the phone's built-in reader when there is one. */
async function decodeQR(src, w, h) {
  if ('BarcodeDetector' in window) {
    try {
      SC.detector = SC.detector || new BarcodeDetector({ formats: ['qr_code'] });
      const r = await SC.detector.detect(src);
      if (r && r.length) return r[0].rawValue;
      return null;
    } catch (e) { /* fall back to jsQR */ }
  }
  await loadJsQR();
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0, w, h);
  const img = g.getImageData(0, 0, w, h);
  const code = window.jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
  return code ? code.data : null;
}
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('QR reader could not load. Check the internet connection.'));
    document.head.appendChild(s);
  });
}
/** Draws part of an image (sx,sy,sw,sh) scaled so its longest side is `size`. Returns {data,w,h,gray()} */
function grab(img, sx, sy, sw, sh, size) {
  const k = Math.min(1, size / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * k)), hh = Math.max(1, Math.round(sh * k));
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, sx, sy, sw, sh, 0, 0, w, hh);
  const d = g.getImageData(0, 0, w, hh);
  return { data: d.data, w, h: hh, canvas: c };
}
function toGray(f) {
  const n = f.w * f.h, out = new Uint8ClampedArray(n), d = f.data;
  for (let i = 0, j = 0; i < n; i++, j += 4) out[i] = (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000;
  return out;
}
/**
 * Reads a QR from a phone photo. Tries the phone's own reader, then jsQR at several sizes and
 * zoomed into the middle, then the stronger ZXing reader. Returns the text or null.
 */
async function decodePhoto(img, onStep) {
  const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  if ('BarcodeDetector' in window) {
    try { const r = await new BarcodeDetector({ formats: ['qr_code'] }).detect(img); if (r && r.length) return r[0].rawValue; } catch (e) {}
  }
  const regions = [[0, 0, W, H]];
  [0.7, 0.5, 0.35].forEach(f => regions.push([W * (1 - f) / 2, H * (1 - f) / 2, W * f, H * f]));   // zoom into the middle
  const sizes = [1600, 1100, 800];
  try {
    await loadJsQR();
    if (onStep) onStep('Reading the QR…');
    for (const rg of regions) for (const s of sizes) {
      const f = grab(img, rg[0], rg[1], rg[2], rg[3], s);
      const c = window.jsQR(f.data, f.w, f.h, { inversionAttempts: 'attemptBoth' });
      if (c && c.data) return c.data;
      await new Promise(r => setTimeout(r, 0));   // keep the screen responsive
    }
  } catch (e) {}
  try {
    await loadZXing();
    if (onStep) onStep('Looking harder…');
    const Z = window.ZXing, hints = new Map();
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.QR_CODE]);
    const reader = new Z.QRCodeReader();
    for (const rg of regions) for (const s of [1400, 900]) {
      const f = grab(img, rg[0], rg[1], rg[2], rg[3], s);
      for (const Bin of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]) {
        try {
          const src = new Z.RGBLuminanceSource(toGray(f), f.w, f.h);
          const res = reader.decode(new Z.BinaryBitmap(new Bin(src)), hints);
          if (res) return res.getText();
        } catch (e) {}
      }
      await new Promise(r => setTimeout(r, 0));
    }
  } catch (e) {}
  return null;
}
function onScanned(text) {
  if (SC.busy) return;
  SC.busy = true;
  if (navigator.vibrate) try { navigator.vibrate(80); } catch (e) {}
  stopScanner();
  const t = String(text || '');
  if (!/[?&]badge=|^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{12}$/.test(t)) {
    SC.busy = false;
    return showScanner(/[?&]name=/.test(t) ? 'This is an old QR badge. Print a new badge from the QR badges tab.' : 'That QR code is not an ARMM worker badge.');
  }
  SC.busy = false;
  showWorker('', t);
}

/** Starts the live camera. Called from a tap, which phones need before they allow the camera. */
async function startLiveScan() {
  const v = $('#cam'), box = $('#scanBox'), msgEl = $('#scanMsg');
  box.classList.remove('idle'); msgEl.textContent = 'Starting camera…';
  $('#scanMain').innerHTML = '<button class="btn scanbig" id="scanStop">■ Stop</button>';
  $('#scanStop').onclick = () => { stopScanner(); box.classList.add('idle'); msgEl.textContent = ''; $('#scanMain').innerHTML = scanButton(false); wireScanControls(); };
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('This browser has no live camera support.'), { name: 'NoSupport' });
    SC.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    if (!$('#cam')) return stopScanner();
    v.srcObject = SC.stream; await v.play();
    msgEl.textContent = 'Looking for a QR code…';
    if (!('BarcodeDetector' in window)) loadJsQR().catch(() => {});
    SC.timer = setInterval(async () => {
      if (SC.busy || !v.videoWidth || SC.reading) return;
      SC.reading = true;
      try {
        const w = Math.min(640, v.videoWidth), hh = Math.round(v.videoHeight * w / v.videoWidth);
        const text = await decodeQR(v, w, hh);
        if (text) onScanned(text);
      } catch (e) {} finally { SC.reading = false; }
    }, 250);
  } catch (e) {
    stopScanner();
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    // Remember: on this phone use the camera-app photo instead
    store.set('armm_photo_scan', '1');
    box.classList.add('idle');
    msgEl.textContent = '';
    $('#scanIdle').innerHTML = '<div class="qrico">' + icon('camera') + '</div><div><b>Live camera isn\'t available here</b>' + (denied ? ' (camera permission blocked)' : '') +
      '.<br>Tap <b>Scan QR</b> below. It opens the camera so you can take a photo of the badge.</div>' +
      (CFG.scannerUrl && !REMOTE ? '<a class="btn dark" href="' + esc(CFG.scannerUrl) + '" target="_top" style="text-decoration:none">Open ARMM Live (live camera)</a>' : '');
    $('#scanMain').innerHTML = scanButton(true);
    if ($('#altShot')) $('#altShot').remove();
    wireScanControls();
  }
}

function dayRows(data, date) {
  const isPast = date < data.today;
  const g = groupRecords(data.records.filter(r => r.day === date));
  const rows = [], seen = {};
  for (const st of data.staff) {
    const k = norm(st.name); seen[k] = 1;
    rows.push(Object.assign({ name: st.name, designation: st.designation }, summarize(g[k + '|' + date] || [], isPast)));
  }
  Object.keys(g).forEach(key => {
    const k = key.split('|')[0];
    if (!seen[k]) rows.push(Object.assign({ name: g[key][0].name, designation: '(not in ManpowerList)' }, summarize(g[key], isPast)));
  });
  return rows;
}
function dateBar(extra) {

    '<span class="updated">' + (A.updated ? 'Updated ' + A.updated.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '') + (DEMO ? ' · sample data' : '') + '</span></div>';

function renderToday() {
  const data = A.data, isToday = A.date === data.today;
  const rows = dayRows(data, A.date);
  const present = rows.filter(r => r.state !== 'absent');
  const cnt = {
    present: present.length,
    onsite: rows.filter(r => r.state === 'onsite').length,
    ot: rows.filter(r => r.state === 'ot').length,
    absent: rows.filter(r => r.state === 'absent').length,
    flags: rows.filter(r => r.flags.length).length

function weekCsv(sep) {

  const lines = [head.map(q).join(sep)];
  rows.forEach(r => lines.push([r.n.name, r.n.designation].concat(r.cells.reduce((a, c) => a.concat(c ? [c.sites.join(' / '), round2(c.reg), round2(c.ot)] : ['', '', '']), []))

const round2 = h => Math.round(h * 100) / 100;

const PAY = () => CFG.pay;
const roundTo = (x, q) => Math.round(x / q + 1e-9) * q;
const peso = n => (n < 0 ? '−₱' : '₱') + (Math.round(Math.abs(n) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const minOf = t => { const p = t.split(':').map(Number); return p[0] * 60 + p[1]; };

/** One worker's pay for one day, using the same rules as the Payroll tab in your sheet. */
function payDay(recs, st) {
  const P = PAY();
  const first = recs.find(r => r.type === 'IN');
  const ot = otRegistered(recs);
  if (!first) return recs.length ? { site: recs[0].site, hours: 0, pay: 0, days: 0, otReg: ot, flag: 'No IN', recs } : null;
  const out = recs.find(r => r.type === 'OUT' && r.ts > first.ts && norm(r.site) === norm(first.site));
  if (!out) return { site: first.site, in: first, hours: 0, pay: 0, days: 0, otReg: ot, flag: 'No OUT', recs };
  const hours = roundTo((out.ts - first.ts) / 36e5, P.ROUND_HOURS_TO);
  const days = Math.min(1, roundTo(hours / P.HOURS_PER_DAY, 0.25));
  let pay, lunch = 0;
  if (hours >= P.FULL_DAY_HOURS) pay = st.rate;
  else {
    lunch = roundTo(Math.max(0, Math.min(minOf(out.time), minOf(P.LUNCH_END)) - Math.max(minOf(first.time), minOf(P.LUNCH_START))) / 60, P.ROUND_HOURS_TO);
    pay = Math.round(Math.max(0, hours - lunch) * st.hourly * 100) / 100;
  }
  return { site: first.site, in: first, out, hours, days, pay, lunch, otReg: ot, recs };
}
function otRegistered(recs) {
  let open = null, h = 0;
  recs.forEach(r => { if (r.type === 'OT-IN' && !open) open = r; else if (r.type === 'OT-OUT' && open) { h += (r.ts - open.ts) / 36e5; open = null; } });
  return roundTo(h, PAY().ROUND_HOURS_TO);
}

function needReason(c) {
  // Only days where the worker scanned OT-IN / OT-OUT need approval
  if (c.reviewed || !(c.otReg > 0)) return null;
  return { type: 'ot', label: 'OT scanned ' + fmtH(c.otReg) + ' h – approve?', hours: c.otReg };

function payrollRows() {
  const d = A.pay, days = [0, 1, 2, 3, 4, 5, 6].map(i => ymd(addDays(parseYmd(A.pw), i)));
  const g = groupRecords(d.records);
  const adj = {};
  (d.adjustments || []).forEach(a => { adj[norm(a.name) + '|' + a.date] = a; });
  const rows = d.staff.map(st => {
    const cells = days.map(day => {
      const c = g[norm(st.name) + '|' + day] ? payDay(g[norm(st.name) + '|' + day], st) : null;
      const a = adj[norm(st.name) + '|' + day];
      if (!c && !a) return null;
      const cell = c || { site: '', hours: 0, pay: 0, days: 0, otReg: 0, recs: [] };
      cell.apprOt = a ? a.otHours : 0;
      cell.reviewed = !!(a && (a.otHours || a.note));
      cell.need = needReason(cell);
      cell.otPay = Math.round(cell.apprOt * st.otRate * 100) / 100;
      return cell;
    });
    const wa = adj[norm(st.name) + '|'] || { amount: 0, note: '', site: '' };
    const sum = k => cells.reduce((s, c) => s + (c ? c[k] : 0), 0);
    const siteDays = {};
    cells.forEach(c => { if (c && c.site) siteDays[c.site] = (siteDays[c.site] || 0) + (c.days || 0.01); });
    const mainSite = Object.keys(siteDays).sort((a, b) => siteDays[b] - siteDays[a])[0] || '';
    const t = { days: sum('days'), hours: sum('hours'), pay: sum('pay'), apprOt: sum('apprOt'), otPay: sum('otPay'), adj: wa.amount, note: wa.note, adjSite: wa.site || '', mainSite };
    t.total = Math.round((t.pay + t.otPay + t.adj) * 100) / 100;
    return { st, cells, t, flags: cells.filter(c => c && c.flag).length, needs: cells.filter(c => c && c.need).length };
  });
  return { days, rows };
}

/** Per-site totals: labour (day pay + approved OT), adjustments charged to the site, and subcontractor fees. */
function siteSummary(rows) {
  const m = {};
  const get = s => (m[s] = m[s] || { site: s, labour: 0, adj: 0, subcon: 0, subs: [] });
  rows.forEach(r => {
    r.cells.forEach(c => { if (c && (c.pay || c.otPay)) get(c.site || '(no site)').labour += c.pay + c.otPay; });
    if (r.t.adj) get(r.t.adjSite || r.t.mainSite || '(no site)').adj += r.t.adj;
  });
  (A.pay.subcons || []).forEach(x => { const s = get(x.site); s.subcon += x.amount; s.subs.push(x); });
  const order = (A.pay.sites || []).map(norm);
  return Object.values(m).map(x => Object.assign(x, { total: x.labour + x.adj + x.subcon }))
    .sort((a, b) => { const ia = order.indexOf(norm(a.site)), ib = order.indexOf(norm(b.site)); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });
}

function payrollCsv(sep) {
  const { days, rows } = payrollRows();
  const q = v => sep === ',' ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const head = ['No', 'Name', 'Rate', 'Hourly', 'OT Rate'].concat(days.reduce((a, d) => a.concat([d + ' Site', d + ' Hrs', d + ' Pay', d + ' Appr OT']), []))
    .concat(['Days', 'Day pay', 'Appr OT hrs', 'OT pay', 'Adjustment', 'Adj. site', 'Note', 'Total']);
  const lines = [head.map(q).join(sep)];
  rows.filter(r => !A.payHideZero || r.t.total || r.t.hours).forEach(r => lines.push([r.st.no, r.st.name, r.st.rate, r.st.hourly, r.st.otRate]
    .concat(r.cells.reduce((a, c) => a.concat(c ? [c.site, c.flag || c.hours, c.pay, c.apprOt || ''] : ['', '', '', '']), []))
    .concat([r.t.days, round2(r.t.pay), r.t.apprOt, round2(r.t.otPay), round2(r.t.adj), r.t.adj ? (r.t.adjSite || r.t.mainSite) : '', r.t.note || '', round2(r.t.total)]).map(q).join(sep)));
  return lines.join('\n');
}

function drawQr(el, text) {
  if (typeof qrcode === 'function') {
    const qr = qrcode(0, 'L'); qr.addData(text); qr.make();   // 'L' = fewer, bigger squares: easier for phones to read
    // drop the QR's white background so the logo watermark shows through
    el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }).replace(/<rect[^>]*fill="white"[^>]*\/>/, '');
  } else el.innerHTML = '<span class="tiny" style="word-break:break-all">' + esc(text) + '</span>';
}

  };
  const pub = u => ({ username: u.username, name: u.name, role: u.role, sites: u.sites });
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const recs = [];
  const mk = (date, min, name, type, site) => {
    const d = new Date(date); d.setHours(0, 0, 0, 0); d.setMinutes(min); d.setSeconds(Math.floor(rnd() * 60));
    return { ts: d.getTime(), day: ymd(d), time: pad(d.getHours()) + ':' + pad(d.getMinutes()), time12: to12(pad(d.getHours()) + ':' + pad(d.getMinutes())), name, type, site };
  };
  const now = new Date();
  for (let i = 13; i >= 0; i--) {
    const date = addDays(now, -i);
    if (date.getDay() === 0) continue;
    STAFF.forEach((s, k) => {
      if (rnd() < 0.08) return;
      const site = SITES[HOME[k]];
      const inM = 7 * 60 + Math.floor(rnd() * (rnd() < 0.1 ? 75 : 35)), outM = 17 * 60 + Math.floor(rnd() * 25);
      const day = [mk(date, inM, s[0], 'IN', site)];
      if (rnd() > 0.04 || i === 0) day.push(mk(date, outM, s[0], 'OUT', site));
      if (k === 4 && i === 3) day[1] = mk(date, 12 * 60 + 40, s[0], 'OUT', site);   // a short day
      if (k === 6 && i === 2) day.length = 1;                                          // a missing OUT
      if (k === 1 && i === 4) day[1] = mk(date, 21 * 60 + 35, s[0], 'OUT', site);   // a long day (possible OT)
      if (k % 3 === 0 && rnd() < 0.6) { day.push(mk(date, outM + 2, s[0], 'OT-IN', site)); day.push(mk(date, outM + 90 + Math.floor(rnd() * 90), s[0], 'OT-OUT', site)); }
      day.forEach(r => { if (r.ts <= now.getTime()) recs.push(r); });

  recs.sort((a, b) => a.ts - b.ts);
  const today = () => ymd(new Date());
  return {
    login(u, p) {

      return Object.assign(base, { worker: { name: st[0], designation: st[1] }, todayRecords: mine.filter(r => r.day === today()), lastSite: mine.length ? mine[mine.length - 1].site : '' });
    },
    submitAttendance(t, p) {

      const n = new Date(), tm = pad(n.getHours()) + ':' + pad(n.getMinutes());
      const dup = recs.filter(r => norm(r.name) === norm(p.name) && r.type === p.type && n - r.ts < 600000).pop();
      if (dup) return { ok: false, duplicate: true, message: p.type + ' was already recorded at ' + dup.time12 + '. No need to scan again.' };
      const r = { ts: n.getTime(), day: ymd(n), time: tm, time12: to12(tm), name: p.name, type: p.type, site: p.site, by: u.username };

    },
    listUsers(t) { auth(t, 'Admin'); return users.map(u => Object.assign(pub(u), { active: u.active, lastLogin: u.lastLogin })); },
    saveUser(t, x) {
      const me = auth(t, 'Admin');
      const un = String(x.username || '').trim().toLowerCase();
      if (!/^[a-z0-9._-]{3,30}$/.test(un)) throw new Error('Username: 3–30 letters, numbers, dot, dash or underscore.');

      if (x.isNew && u) throw new Error('That username is already taken.');

      if (x.password && x.password.length < 6) throw new Error('Password must be at least 6 characters.');

      if (!adjs.length && week === ymd(weekStartOf(addDays(new Date(), -7)))) {
        adjs = [{ week, name: 'Ramon Villanueva', date: ymd(addDays(parseYmd(week), 2)), otHours: 2, amount: 0, note: '' },
          { week, name: 'Gina Lopez', date: '', otHours: 0, amount: 1000, note: 'Allowance', site: 'OFFICE / ADMIN' }];
        subs = [{ week, id: 's1', site: 'ALTA MONTE', contractor: 'JM Tiling Works', amount: 15000, note: 'Tiling 2nd floor' },
          { week, id: 's2', site: 'B4L13_MONTEBELLO', contractor: 'RC Electrical', amount: 8500, note: 'Rough-in' }];
      }
      return { staff: staffFull(), sites: SITES, today: today(), records: recs.filter(r => r.day >= week && r.day <= end),
        adjustments: adjs.filter(a => a.week === week), subcons: subs.filter(s => s.week === week) };
    },
    saveAdjustment(t, a) {
      auth(t, 'Admin');
      if (a.amount && !a.site) throw new Error('Choose which site the adjustment is charged to.');
      adjs = adjs.filter(x => !(x.week === a.week && norm(x.name) === norm(a.name) && x.date === (a.date || '')));
      if (a.otHours || a.amount || a.note) adjs.push({ week: a.week, name: a.name, date: a.date || '', otHours: Number(a.otHours) || 0, amount: Number(a.amount) || 0, note: a.note || '', site: a.site || '' });
      return adjs.filter(x => x.week === a.week);
    },
    saveSubcon(t, s) {
      auth(t, 'Admin');
      if (!s.site) throw new Error('Choose a site.');
      if (!String(s.contractor || '').trim()) throw new Error('Enter the subcontractor name.');
      if (!s.amount) throw new Error('Enter the fee amount.');
      subs = subs.filter(x => x.id !== s.id);
      subs.push({ week: s.week, id: s.id || String(Date.now()), site: s.site, contractor: s.contractor.trim(), amount: s.amount, note: s.note || '' });
      return subs.filter(x => x.week === s.week);
    },
    getMasterData(t) {
      auth(t, 'Admin');
      return { appUrl: BOOT.appUrl, staff: staffFull().map((s, i) => Object.assign(s, { row: i + 2, link: i < 12 ? BOOT.appUrl + '?badge=demo.' + encodeURIComponent(s.name) : 'https://docs.google.com/forms/…', otFormula: true, hourlyFormula: true })),
        sites: SITES.map((n, i) => ({ row: i + 3, no: i + 1, name: n, remarks: '' })) };
    },
    saveWorker(t, w) {
      auth(t, 'Admin');
      if (!String(w.name || '').trim()) throw new Error('Enter the full name.');
      if (!(w.rate > 0)) throw new Error('Enter the daily rate.');
      const i = w.row ? w.row - 2 : STAFF.length;
      if (STAFF.some((s, k) => k !== i && norm(s[0]) === norm(w.name))) throw new Error('"' + w.name + '" is already in the ManpowerList.');
      STAFF[i] = [w.name.trim(), w.designation || '']; RATE[i] = w.rate; HOME[i] = HOME[i] == null ? 0 : HOME[i];
      return this.getMasterData(t);
    },
    saveSite(t, s) {
      auth(t, 'Admin');
      if (!String(s.name || '').trim()) throw new Error('Enter the site name.');
      if (s.row) SITES[s.row - 3] = s.name.trim(); else SITES.splice(SITES.length - 1, 0, s.name.trim());
      return this.getMasterData(t);
    },
    deleteSite(t, row, name) {
      auth(t, 'Admin');
      const i = row - 3;
      if (SITES[i] !== name) throw new Error('That site has moved or changed. Refresh the page and try again.');
      if (recs.some(r => r.site === name && r.ts > Date.now() - 14 * 864e5)) throw new Error('"' + name + '" has scans in the last 14 days, so it can\'t be deleted yet. Delete it after its payroll is finished.');
      SITES.splice(i, 1);
      return this.getMasterData(t);
    },
    getArchivePreview(t) {
      auth(t, 'Admin');
      const cut = new Date(); cut.setHours(0, 0, 0, 0); cut.setMonth(cut.getMonth() - 3);
      return { cutoff: cut.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }), months: 3, folder: 'Archive', last: '',
        counts: [{ sheet: 'AttendanceData', rows: 4812, total: 7395 }, { sheet: 'PayrollAdjustments', rows: 6, total: 9 }, { sheet: 'SubconFees', rows: 0, total: 2 }] };
    },
    archiveOldRecords(t, w) {
      auth(t, 'Admin');
      if (w !== 'ARCHIVE') throw new Error('Type ARCHIVE to confirm.');
      return { ok: true, copyUrl: 'https://docs.google.com/spreadsheets/', copyName: 'Attendance – Archive (sample)', folderUrl: 'https://drive.google.com/',
        deleted: { AttendanceData: 4812, PayrollAdjustments: 6, SubconFees: 0 }, cutoff: '' };
    },
    deleteSubcon(t, week, id) { auth(t, 'Admin'); subs = subs.filter(x => x.id !== id); return subs.filter(x => x.week === week); }
  };
})();

/* ===================== router ===================== */
function route(mode) {
  const p = BOOT.params || {};
  if (p.outside && !mode) return showOutside();
  mode = mode || S.mode || (p.admin ? 'admin' : 'scan');
  S.mode = mode;
  stopScanner();
  if (DEMO) $$('#demoBar button').forEach(b => b.classList.toggle('on', b.dataset.demo === mode));
  if (mode === 'outside') return showOutside();
  if (!S.token) return showLogin();
  if (mode === 'admin') return loadAdmin(true);
  if (mode === 'worker') return showWorker('', BOOT.appUrl + '?badge=demo.Ramon%20Villanueva');
  if (mode === 'picker') return showPicker();
  return showScanner();
}
if (REMOTE) {
  loading('Connecting to ARMM…');
  api('getConfig').then(c => { BOOT.appUrl = c.appUrl || REMOTE; Object.assign(CFG, c.config || {}); route(); })
    .catch(e => { $('#app').innerHTML = '<div class="login"><div class="panel"><div class="msg err">' + esc(errMsg(e)) + '</div><button class="btn" onclick="location.reload()">Try again</button></div></div>'; });
} else if (DEMO) {
  $('#demoBar').hidden = false;
  $$('#demoBar button').forEach(b => b.onclick = () => { clearInterval(A.timer); route(b.dataset.demo); });
  route('scan');
} else route();
</script>
